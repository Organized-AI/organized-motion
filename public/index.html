<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organized Motion // composition stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#050608; --panel:#0A0D0C; --line:#1B211E;
    --ink:#EDEFEC; --mute:#6E7873;
    --lime:#B7FF3C; --amber:#FFCC4D; --teal:#3CE0D0;
    --mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--mono);
    font-size:13px; display:grid; grid-template-rows:auto 1fr auto;
    min-height:100vh; overflow:hidden;
  }

  /* ---- topbar ---- */
  .bar{
    display:flex; align-items:center; gap:16px;
    padding:10px 16px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .mark{
    font-weight:700; letter-spacing:.14em; font-size:11px;
    color:var(--bg); background:var(--lime); padding:3px 7px;
  }
  .bar .path{color:var(--mute); letter-spacing:.06em; font-size:11px}
  .bar .path b{color:var(--ink); font-weight:500}
  .bar .right{margin-left:auto; display:flex; gap:14px; align-items:center}
  .stat{color:var(--mute); font-size:11px; letter-spacing:.06em}
  .stat b{color:var(--teal); font-weight:500}

  /* ---- stage ---- */
  .stage-wrap{display:grid; place-items:center; padding:20px; position:relative}
  #stage{
    position:relative; background:#000; overflow:hidden;
    box-shadow:0 0 0 1px var(--line), 0 30px 80px -40px #000;
    aspect-ratio:9/16; height:min(72vh, 900px);
  }
  #stage.a11{aspect-ratio:1/1} #stage.a169{aspect-ratio:16/9}
  #stage video, #stage canvas{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0;
  }
  #three{z-index:2; pointer-events:none}
  .caption{
    position:absolute; left:50%; bottom:14%; transform:translateX(-50%);
    z-index:3; background:rgba(0,0,0,.62); backdrop-filter:blur(6px);
    padding:8px 14px; border-radius:2px; font-weight:700; font-size:20px;
    letter-spacing:-.01em; text-align:center; max-width:82%; opacity:0;
    line-height:1.25;
  }
  .caption em{color:var(--lime); font-style:normal}

  /* ---- beat ribbon: the signature element ----
     Not decoration. Each segment is a real shot, its width is real
     duration, its fill height is the TwelveLabs gate score. Gated
     shots read amber so a weak beat is visible before you press play. */
  .rail{border-top:1px solid var(--line); background:var(--panel); padding:12px 16px 16px}
  .ribbon{display:flex; gap:2px; height:46px; align-items:flex-end; cursor:pointer}
  .seg{position:relative; background:#11150F; overflow:hidden; min-width:14px}
  .seg .fill{position:absolute; left:0; right:0; bottom:0; background:var(--lime); opacity:.85}
  .seg.gated .fill{background:var(--amber)}
  .seg .lbl{
    position:absolute; top:4px; left:5px; font-size:9px; letter-spacing:.1em;
    color:var(--bg); font-weight:700; mix-blend-mode:difference;
  }
  .seg .sc{position:absolute; bottom:3px; right:4px; font-size:9px; color:var(--bg); font-weight:700}
  .playhead{position:relative; height:2px; background:var(--line); margin-top:6px}
  .playhead i{position:absolute; top:-3px; width:2px; height:8px; background:var(--teal); left:0}
  .controls{display:flex; gap:10px; align-items:center; margin-top:12px}
  button{
    font-family:var(--mono); font-size:11px; letter-spacing:.1em; font-weight:500;
    background:transparent; color:var(--ink); border:1px solid var(--line);
    padding:6px 12px; cursor:pointer;
  }
  button:hover{border-color:var(--lime); color:var(--lime)}
  button:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
  .tc{color:var(--mute); margin-left:auto; letter-spacing:.08em}
  .tc b{color:var(--ink); font-weight:500}
  .empty{color:var(--mute); text-align:center; line-height:1.9}
  .empty code{color:var(--lime)}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>

<header class="bar">
  <span class="mark">OM</span>
  <span class="path">motion.organizedai.vip / <b id="briefName">no brief loaded</b></span>
  <span class="right">
    <span class="stat">SHOTS <b id="sShots">0</b></span>
    <span class="stat">GATED <b id="sGated">0</b></span>
    <span class="stat">RUNTIME <b id="sRun">0.0s</b></span>
  </span>
</header>

<main class="stage-wrap">
  <div id="stage">
    <canvas id="three"></canvas>
    <div class="caption" id="cap"></div>
  </div>
</main>

<section class="rail">
  <div class="ribbon" id="ribbon">
    <div class="empty" style="width:100%">
      Load a timeline to compose.<br>
      <code>?brief=brief_xxx</code> pulls from the vault, or drop a timeline.json on this page.
    </div>
  </div>
  <div class="playhead"><i id="ph"></i></div>
  <div class="controls">
    <button id="play">PLAY</button>
    <button id="restart">RESTART</button>
    <button id="a916">9:16</button>
    <button id="a11">1:1</button>
    <button id="a169">16:9</button>
    <span class="tc"><b id="tc">00:00.00</b> / <span id="tcTotal">00:00.00</span></span>
  </div>
</section>

<script>
/* ------------------------------------------------------------------
   Organized Motion composition stage.

   timeline.json is the contract between the understanding plane and
   this surface. Nothing here talks to a generation API. Composition is
   deterministic so that a HyperFrames render and a browser preview
   produce identical frames.

   HyperFrames drives window.__motion.seek(t) frame by frame with the
   GSAP timeline paused. Never rely on wall-clock time in this file.
------------------------------------------------------------------- */

const stage = document.getElementById('stage');
const cap   = document.getElementById('cap');
const ribbon= document.getElementById('ribbon');
const ph    = document.getElementById('ph');
const tcEl  = document.getElementById('tc');

let tl = null, DATA = null, mediaEls = [];

const fmt = t => {
  const m = Math.floor(t/60), s = Math.floor(t%60), c = Math.floor((t%1)*100);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
};

/* ---- Three.js layer for Meshy GLB props ---- */
let renderer, scene, camera;
function initThree(){
  const canvas = document.getElementById('three');
  renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050608, 0.035);
  const r = stage.clientWidth / stage.clientHeight;
  camera = new THREE.OrthographicCamera(-8*r, 8*r, 8, -8, 0.1, 200);
  camera.position.set(16,12,16);
  camera.lookAt(0,0,0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xB7FF3C, 1.1);
  key.position.set(6,10,6); scene.add(key);
  resizeThree();
}
function resizeThree(){
  if(!renderer) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  const r = w/h;
  camera.left = -8*r; camera.right = 8*r; camera.updateProjectionMatrix();
}

/* ---- build the timeline ---- */
function build(data){
  DATA = data;
  if(tl) tl.kill();
  mediaEls.forEach(el => el.remove());
  mediaEls = [];
  ribbon.innerHTML = '';

  document.getElementById('briefName').textContent = data.briefId || 'untitled';
  document.getElementById('sShots').textContent = data.clips.length;
  document.getElementById('sGated').textContent = data.clips.filter(c => c.score < 65).length;
  document.getElementById('sRun').textContent = data.totalDuration.toFixed(1) + 's';
  document.getElementById('tcTotal').textContent = fmt(data.totalDuration);

  stage.className = data.aspect === '1:1' ? 'a11' : data.aspect === '16:9' ? 'a169' : '';
  resizeThree();

  tl = gsap.timeline({
    paused: true,
    onUpdate(){
      const t = tl.time();
      tcEl.textContent = fmt(t);
      ph.style.left = (t / data.totalDuration * 100) + '%';
    }
  });

  data.clips.forEach(clip => {
    const v = document.createElement('video');
    v.src = clip.src; v.muted = true; v.playsInline = true; v.preload = 'auto';
    stage.insertBefore(v, document.getElementById('three'));
    mediaEls.push(v);

    tl.set(v, {opacity:0}, 0);
    tl.to(v, {opacity:1, duration:0.28, ease:'power2.out'}, clip.start)
      .to(v, {opacity:0, duration:0.28, ease:'power2.in'}, clip.start + clip.duration - 0.28);

    if(clip.caption){
      tl.set(cap, {innerHTML: clip.caption}, clip.start)
        .fromTo(cap, {opacity:0, y:14}, {opacity:1, y:0, duration:0.22, ease:'power3.out'}, clip.start + 0.06)
        .to(cap, {opacity:0, duration:0.16}, clip.start + clip.duration - 0.2);
    }

    /* ribbon segment: width is duration, fill height is gate score */
    const seg = document.createElement('div');
    seg.className = 'seg' + (clip.score < 65 ? ' gated' : '');
    seg.style.flex = clip.duration;
    seg.innerHTML = `<div class="fill" style="height:${Math.max(clip.score,6)}%"></div>
                     <span class="lbl">${(clip.beat||'').toUpperCase()}</span>
                     <span class="sc">${Math.round(clip.score)}</span>`;
    seg.addEventListener('click', () => seek(clip.start + 0.01));
    ribbon.appendChild(seg);
  });

  tl.to({}, {duration: 0.01}, data.totalDuration);
  seek(0);
}

function seek(t){
  if(!tl) return;
  tl.pause().time(t);
  DATA.clips.forEach((clip, i) => {
    const v = mediaEls[i];
    const local = t - clip.start;
    if(local >= 0 && local <= clip.duration){
      if(Math.abs(v.currentTime - local) > 0.05) v.currentTime = local;
    }
  });
  if(renderer) renderer.render(scene, camera);
}

/* HyperFrames deterministic render hook */
window.__motion = {
  seek,
  get duration(){ return DATA ? DATA.totalDuration : 0; },
  load: build,
  ready(){ return Boolean(DATA); }
};

/* ---- controls ---- */
document.getElementById('play').addEventListener('click', function(){
  if(!tl) return;
  if(tl.paused()){ mediaEls.forEach(v=>v.play().catch(()=>{})); tl.play(); this.textContent='PAUSE'; }
  else { mediaEls.forEach(v=>v.pause()); tl.pause(); this.textContent='PLAY'; }
});
document.getElementById('restart').addEventListener('click', () => {
  seek(0); document.getElementById('play').textContent = 'PLAY';
});
[['a916',''],['a11','a11'],['a169','a169']].forEach(([id, cls]) => {
  document.getElementById(id).addEventListener('click', () => {
    stage.className = cls; resizeThree(); seek(tl ? tl.time() : 0);
  });
});
addEventListener('resize', () => { resizeThree(); if(tl) seek(tl.time()); });

/* drag a timeline.json straight onto the page */
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if(f) build(JSON.parse(await f.text()));
});

/* ---- boot ---- */
initThree();
(async () => {
  const brief = new URLSearchParams(location.search).get('brief');
  const url = brief ? `/timeline/${brief}` : '/timeline.example.json';
  try {
    const res = await fetch(url);
    if(res.ok) build(await res.json());
  } catch (err) {
    console.warn('no timeline available', err);
  }
})();
</script>
</body>
</html>
